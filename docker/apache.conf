# Libera o .htaccess do sistema (bloqueio de app/, storage/, .env etc.).
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>
ServerTokens Prod
ServerSignature Off
# O Coolify entrega HTTPS pelo proxy: o cookie de sessão passa a ser "secure".
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
