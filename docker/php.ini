date.timezone = America/Sao_Paulo
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 512M
max_execution_time = 120
expose_php = Off
; Avisos do PHP vão para o log do container (Coolify → Logs), nunca para a resposta da API.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
