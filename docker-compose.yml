# Opção "tudo junto" no Coolify (Build Pack: Docker Compose): sistema + MariaDB.
# Defina no Coolify: DB_PASS, DB_ROOT_PASS e APP_KEY (32+ caracteres). OPENAI_KEY/OPENAI_MODEL são opcionais.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: axioma_furto_roubo
      DB_USER: sistema_fb
      DB_PASS: ${DB_PASS}
      APP_KEY: ${APP_KEY}
      OPENAI_KEY: ${OPENAI_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - db
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: axioma_furto_roubo
      MARIADB_USER: sistema_fb
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
volumes:
  storage:
  db:
